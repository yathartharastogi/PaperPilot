version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: paperpilot_postgres
    environment:
      POSTGRES_USER: paperpilot
      POSTGRES_PASSWORD: paperpilot_password
      POSTGRES_DB: paperpilot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: paperpilot_redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    container_name: paperpilot_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
